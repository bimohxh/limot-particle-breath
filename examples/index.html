<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Particle Breath by Limot: an open-source breathing particle background for JavaScript, React, and Vue. Explore more animated backgrounds at limot.dev."
    />
    <title>Particle Breath — Limot</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111;
        color: #e0dfd8;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      header {
        position: absolute;
        inset: 0 0 auto;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 28px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
      }
      nav {
        display: flex;
        gap: 20px;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      #stage {
        height: 100svh;
        min-height: 360px;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      footer {
        position: absolute;
        bottom: 24px;
        width: 100%;
        padding: 0 28px;
        text-align: center;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Particle Breath</h1>
      <nav>
        <a href="https://github.com/bimohxh/limot-particle-breath"
          >Source on GitHub</a
        ><a href="https://limot.dev">Made by Limot</a>
      </nav>
    </header>
    <main id="stage">
      <canvas
        aria-label="A soft folded particle volume gently breathing in place"
      ></canvas>
    </main>
    <footer>
      Open-source Canvas animation · Zero runtime dependencies · MIT
    </footer>
    <script type="module">
      import { mountParticleBreath } from "../src/index.js";
      const preference = matchMedia("(prefers-reduced-motion: reduce)");
      const stop = mountParticleBreath(
        document.querySelector("canvas"),
        () => ({ speed: preference.matches ? 0 : 1 }),
      );
      window.addEventListener("pagehide", stop, { once: true });
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) location.reload();
      });
    </script>
  </body>
</html>
